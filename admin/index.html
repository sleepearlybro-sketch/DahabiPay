<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dahabi Pay Operations</title><link rel="stylesheet" href="/admin/assets/admin.css"><script type="module" src="/admin/assets/admin.js"></script></head><body>
<section class="login" id="login"><form class="login__card" id="loginForm"><a class="brand" href="/"><b>D</b>Dahabi Pay</a><h1>Staff sign in</h1><p>Use your authorized staff email. We will send a six-digit code.</p><label>Email<input id="loginEmail" type="email" autocomplete="email" required></label><label id="codeField" class="hidden">Verification code<input id="loginCode" inputmode="numeric" autocomplete="one-time-code" maxlength="6"></label><p class="error" id="loginError"></p><button id="loginButton">Send sign-in code</button></form></section>
<div class="app hidden" id="app"><aside><a class="brand" href="/"><b>D</b>Dahabi Pay</a><nav><button class="active" data-view="dashboard">Overview</button><button data-view="requests">Requests</button><button data-view="settings">Settings</button></nav><div class="staff"><strong id="staffName"></strong><small id="staffRole"></small><button id="logout">Sign out</button></div></aside><main><header><div><h1 id="pageTitle">Overview</h1><p id="pageHint">Live manual exchange operations</p></div><span class="live">● Live</span></header>
<section id="dashboardView"><div class="stats"><article><span>Awaiting contact</span><b id="verifiedCount">0</b></article><article><span>Contacted</span><b id="contactedCount">0</b></article><article><span>Active exchanges</span><b id="activeCount">0</b></article><article><span>Completed</span><b id="completedCount">0</b></article></div><div class="panel"><h2>Recent requests</h2><div id="recent"></div></div></section>
<section id="requestsView" class="hidden"><div class="panel"><div class="filters"><input id="search" placeholder="Reference, customer, email or WhatsApp"><select id="statusFilter"><option value="">All statuses</option><option value="verified">Verified</option><option value="contacted">Contacted</option><option value="in_progress">In progress</option><option value="completed">Completed</option><option value="cancelled">Cancelled</option></select><input id="fromDate" type="date"><input id="toDate" type="date"><button id="filterBtn">Search</button></div><div id="requestList"></div></div></section>
<section id="settingsView" class="hidden"><form class="panel form" id="settingsForm"><h2>Exchange settings</h2><div class="row"><label>Customer rate<input id="settingRate" inputmode="decimal" required></label><label>Minimum USDT<input id="settingMin" inputmode="decimal" required></label><label>Maximum USDT<input id="settingMax" inputmode="decimal" required></label></div><label>Operations notification email<input id="settingEmail" type="email"></label><label>WhatsApp message template<textarea id="settingMessage" required></textarea><small>Available: {{name}}, {{reference}}, {{send}}, {{receive}}</small></label><label class="switch"><input id="settingEnabled" type="checkbox"> Accept new exchange requests</label><p class="error" id="settingsError"></p><button>Save settings</button></form></section>
</main></div>
<dialog id="detailDialog"><div class="dialog__head"><div><h2 id="detailRef"></h2><span class="badge" id="detailStatus"></span></div><button id="closeDetail" aria-label="Close">×</button></div><div id="detailBody"></div></dialog>
</body></html>
