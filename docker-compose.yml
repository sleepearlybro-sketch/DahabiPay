# =============================================================================
# Dahabi Pay - deployment template; complete the launch gates in DEPLOY.md
#
#   docker compose up -d
#
# Three services: the app, Caddy in front of it for automatic TLS, and
# Litestream replicating the SQLite file to object storage continuously.
#
# Before the first run:
#   1. cp .env.example .env   and fill it in (ADMIN_PASSWORD is mandatory)
#   2. set DOMAIN and ACME_EMAIL below, or in .env
#   3. docker compose run --rm app npm run seed
# =============================================================================

services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      DB_FILE: /data/exchangepay.db
      COOKIE_SECURE: 1
      PUBLIC_ORIGIN: https://${DOMAIN:?set DOMAIN in .env}
    volumes:
      - appdata:/data
    # not published to the host: Caddy is the only way in
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config

  # Continuous replication of the SQLite file to S3-compatible storage.
  # Replication is one recovery layer, not a production-readiness guarantee.
  # Configure and pin the image, and test DB plus KYC recovery before launch.
  # Comment the whole service out if you have not set up a bucket yet.
  litestream:
    image: litestream/litestream:latest
    restart: unless-stopped
    depends_on:
      - app
    command: replicate
    environment:
      LITESTREAM_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      LITESTREAM_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
    volumes:
      - appdata:/data
      - ./deploy/litestream.yml:/etc/litestream.yml:ro

volumes:
  appdata:
  caddydata:
  caddyconfig:
