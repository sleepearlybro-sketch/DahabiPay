<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>News - Dahabi Pay</title>
<link rel="stylesheet" href="../assets/css/app.css">
</head>
<body>

<div data-shell-header></div>

<main>
  <div class="shell">
    <section class="section">
      <div class="doc" data-article>
        <p class="muted">Loading&hellip;</p>
      </div>

      <p style="margin-top:20px"><a class="btn btn--ghost" href="news.html">&#8592; All news</a></p>
    </section>
  </div>
</main>

<div data-shell-footer></div>

<script src="../assets/js/data.js"></script>
<script src="../assets/js/api.js"></script>
<script src="../assets/js/app.js"></script>
<script>
  /* One article, selected by ?slug=. Falls back to the bundled dataset so the
     page still says something useful without a server. */
  EP.ready.then(function () {
    var host = document.querySelector('[data-article]');
    var slug = new URLSearchParams(location.search).get('slug');

    var esc = function (s) {
      return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
      });
    };

    var render = function (a) {
      if (!a) {
        host.innerHTML = '<h2>Article not found</h2>' +
          '<p class="muted">That story is no longer published.</p>';
        return;
      }
      document.title = a.title + ' - Dahabi Pay';
      // body is optional; the excerpt always exists
      var body = (a.body || '').trim();
      host.innerHTML =
        '<p class="small muted" style="font-weight:700">' +
          esc(a.date || EP.fmtDate(a.published_at)) + '</p>' +
        '<h2 style="margin-top:8px">' + esc(a.title) + '</h2>' +
        '<p style="font-size:17px;margin-top:18px"><b>' + esc(a.excerpt) + '</b></p>' +
        (body
          ? body.split(/\n{2,}/).map(function (para) {
              return '<p>' + esc(para) + '</p>';
            }).join('')
          : '<p class="muted small">The full text of this announcement has not been ' +
            'published yet. Add it in the <code>news</code> table.</p>');
    };

    if (!EP.live) {
      render((EP.news || []).filter(function (n) { return !slug || n.slug === slug; })[0]);
      return;
    }

    EP.api('/v1/news').then(function (list) {
      render(list.filter(function (n) { return !slug || n.slug === slug; })[0]);
    }).catch(function () {
      render((EP.news || [])[0]);
    });
  });
</script>
</body>
</html>
