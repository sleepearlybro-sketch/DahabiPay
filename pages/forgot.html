<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reset your password - Dahabi Pay</title>
<link rel="stylesheet" href="../assets/css/app.css">
</head>
<body>

<div data-shell-header></div>

<main>
  <div class="shell">
    <div class="auth">
      <div class="card">
        <h2 class="card__title">Reset your password</h2>
        <p class="muted small" style="margin-bottom:22px">
          Enter the address on your account and we will send a single-use reset link,
          valid for one hour.
        </p>

        <form class="form" data-form="forgot" novalidate>
          <div class="form__field">
            <label>Email <i>*</i></label>
            <input class="input" name="email" type="email" data-rule="required email" autocomplete="email">
          </div>

          <div class="form__field">
            <label>Captcha <i>*</i></label>
            <div class="captcha">
              <span class="captcha__img"></span>
              <button type="button" class="captcha__reload" title="New code">&#8635;</button>
              <input class="input" data-captcha-input placeholder="Enter the code" autocomplete="off">
            </div>
          </div>

          <button class="btn btn--lg btn--block" type="submit">Send the reset link</button>

          <div class="form__foot">
            Remembered it? <a href="signin.html">Sign in</a>
          </div>
        </form>
      </div>

      <p class="small muted center" style="margin-top:16px">
        The reply is the same whether or not the address is registered, so this page
        cannot be used to discover who has an account.
      </p>
    </div>
  </div>
</main>

<div data-shell-footer></div>

<script src="../assets/js/data.js"></script>
<script src="../assets/js/api.js"></script>
<script src="../assets/js/app.js"></script>
<script src="../assets/js/forms.js"></script>
</body>
</html>
