<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Transactions history - Dahabi Pay</title>
<link rel="stylesheet" href="../assets/css/app.css">
</head>
<body>

<div data-shell-header></div>

<main>
  <div class="shell">
    <div class="dash">
      <div data-shell-side></div>

      <div>
        <div class="section__head" style="margin-top:0">
          <h2>Transactions history</h2>
          <a class="btn btn--sm" href="../index.html">New exchange</a>
        </div>

        <div class="filters">
          <select data-hstatus>
            <option value="">All statuses</option>
            <option value="wait">Awaiting payment</option>
            <option value="proc">Processing</option>
            <option value="done">Completed</option>
            <option value="err">Cancelled</option>
          </select>
        </div>

        <div class="table-wrap" data-render="history">
          <table class="tbl">
            <thead><tr><th>Application</th><th>Sent</th><th>Received</th><th>Status</th><th></th></tr></thead>
            <tbody></tbody>
          </table>
        </div>

        <p class="small muted" style="margin-top:14px">
          Orders you create in this demo are stored in your browser only. Clearing site
          data resets the list to the sample records.
        </p>
      </div>
    </div>
  </div>
</main>

<div data-shell-footer></div>

<script src="../assets/js/data.js"></script>
<script src="../assets/js/api.js"></script>
<script src="../assets/js/app.js"></script>
<script src="../assets/js/exchanger.js"></script>
<script src="../assets/js/forms.js"></script>
</body>
</html>
