<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Personal Profile - Dahabi Pay</title>
<link rel="stylesheet" href="../assets/css/app.css">
</head>
<body>

<div data-shell-header></div>

<main>
  <div class="shell">
    <div class="dash">
      <div data-shell-side></div>

      <div data-profile>
        <div class="section__head" style="margin-top:0">
          <h2>Personal Profile</h2>
          <a class="btn btn--sm" href="../index.html">New exchange</a>
        </div>

        <div class="stats" data-profile-stats>
          <div class="stat"><span>Loading</span><b>&hellip;</b></div>
        </div>

        <div class="card" style="margin-top:18px">
          <h3 style="margin-bottom:16px">Account settings</h3>
          <form class="form" data-form="profile" novalidate>
            <div class="form__field">
              <label>Login</label>
              <input class="input" name="login" data-user-value readonly>
            </div>
            <div class="form__field">
              <label>Email <i>*</i></label>
              <input class="input" name="email" type="email" data-rule="required email" value="user@example.com">
            </div>
            <div class="form__field">
              <label>Personal PIN code</label>
              <input class="input" name="pin" inputmode="numeric" data-rule="pin" placeholder="4-6 digits">
              <span class="hint">Asked at sign-in and before any payout requisite change.</span>
            </div>
            <div class="form__field">
              <label>Default notification language</label>
              <select class="select" name="lang">
                <option>English</option><option>Fran&ccedil;ais</option><option>&#1575;&#1604;&#1593;&#1585;&#1576;&#1610;&#1577;</option>
              </select>
            </div>
            <label class="check"><input type="checkbox" checked><span>Email me on every status change</span></label>
            <label class="check"><input type="checkbox"><span>Require email confirmation for new requisites</span></label>
            <div><button class="btn" type="submit">Save changes</button></div>
          </form>
        </div>

        <div class="card" style="margin-top:18px">
          <h3 style="margin-bottom:14px">Verification</h3>
          <div class="kv" data-verification>
            <div><span>Loading</span><b>&hellip;</b></div>
          </div>
          <p class="small muted" style="margin-top:14px">
            Verification is requested only where our <a href="aml-kyc.html">AML/KYC Policy</a> requires it.
          </p>
          <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:16px">
            <a class="btn btn--sm btn--ghost" href="security.html">Security settings</a>
            <a class="btn btn--sm btn--ghost" href="kyc.html">Upload documents</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</main>

<div data-shell-footer></div>

<script src="../assets/js/data.js"></script>
<script src="../assets/js/api.js"></script>
<script src="../assets/js/app.js"></script>
<script src="../assets/js/forms.js"></script>
</body>
</html>
