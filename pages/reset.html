<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Choose a new password - Dahabi Pay</title>
<link rel="stylesheet" href="../assets/css/app.css">
</head>
<body>

<div data-shell-header></div>

<main>
  <div class="shell">
    <div class="auth">
      <div class="card">
        <h2 class="card__title">Choose a new password</h2>
        <p class="muted small" style="margin-bottom:22px">
          Setting a new password signs out every other device on the account.
        </p>

        <form class="form" data-form="reset" novalidate>
          <div class="form__field">
            <label>New password <i>*</i></label>
            <input class="input" name="password" id="pw" type="password"
                   data-rule="required pass" autocomplete="new-password">
            <span class="hint">At least 8 characters.</span>
          </div>

          <div class="form__field">
            <label>Confirm new password <i>*</i></label>
            <input class="input" name="password2" type="password"
                   data-rule="required" data-match="#pw" autocomplete="new-password">
          </div>

          <button class="btn btn--lg btn--block" type="submit">Change my password</button>

          <div class="form__foot">
            <a href="signin.html">Back to sign-in</a>
          </div>
        </form>
      </div>

      <p class="small muted center" style="margin-top:16px" data-no-token hidden>
        This page needs the link from your email - open it from there.
      </p>
    </div>
  </div>
</main>

<div data-shell-footer></div>

<script src="../assets/js/data.js"></script>
<script src="../assets/js/api.js"></script>
<script src="../assets/js/app.js"></script>
<script src="../assets/js/forms.js"></script>
<script>
  // Without a token the form cannot succeed, so say so up front rather than
  // letting someone fill it in and fail on submit.
  document.addEventListener('DOMContentLoaded', function () {
    if (new URLSearchParams(location.search).get('token')) return;
    document.querySelector('[data-no-token]').hidden = false;
    var form = document.querySelector('[data-form="reset"]');
    form.querySelectorAll('input, button').forEach(function (el) { el.disabled = true; });
  });
</script>
</body>
</html>
