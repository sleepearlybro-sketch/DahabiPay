<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reviews - Dahabi Pay</title>
<link rel="stylesheet" href="../assets/css/app.css">
</head>
<body>

<div data-shell-header></div>

<main>
  <div class="shell">
    <section class="section">
      <div class="section__head">
        <h2>Reviews</h2>
        <span class="tag tag--ok">Average 4.9 / 5</span>
      </div>
      <div class="reviews" data-render="reviews" data-limit="24"></div>
    </section>

    <section class="section">
      <div class="card" style="max-width:620px">
        <h3 style="margin-bottom:14px">Leave a review</h3>
        <form class="form" data-form="review" novalidate>
          <div class="form__field">
            <label>Your name <i>*</i></label>
            <input class="input" name="who" data-rule="required">
          </div>
          <div class="form__field">
            <label>Application ID</label>
            <input class="input" name="oid" placeholder="EP-XXXXX-00000">
            <span class="hint">Reviews tied to a completed order are marked as verified.</span>
          </div>
          <div class="form__field">
            <label>Your review <i>*</i></label>
            <textarea class="input" name="text" rows="4" data-rule="required"></textarea>
          </div>
          <div class="form__field">
            <label>Captcha <i>*</i></label>
            <div class="captcha">
              <span class="captcha__img"></span>
              <button type="button" class="captcha__reload" title="New code">&#8635;</button>
              <input class="input" data-captcha-input placeholder="Enter the code" autocomplete="off">
            </div>
          </div>
          <div><button class="btn" type="submit">Publish review</button></div>
        </form>
      </div>
    </section>
  </div>
</main>

<div data-shell-footer></div>

<script src="../assets/js/data.js"></script>
<script src="../assets/js/api.js"></script>
<script src="../assets/js/app.js"></script>
<script src="../assets/js/exchanger.js"></script>
<script src="../assets/js/forms.js"></script>
</body>
</html>
