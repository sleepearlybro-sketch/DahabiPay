<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign up - Dahabi Pay</title>
<link rel="stylesheet" href="../assets/css/app.css">
</head>
<body>

<div data-shell-header></div>

<main>
  <div class="shell">
    <div class="auth">
      <div class="card">
        <h2 class="card__title">Create an account</h2>
        <p class="muted small" style="margin-bottom:22px">
          Registration is optional - it unlocks history, saved requisites,
          the affiliate program and volume rates.
        </p>

        <form class="form" data-form="signup" novalidate>
          <div class="form__field">
            <label>Login <i>*</i></label>
            <input class="input" name="login" data-rule="required login" autocomplete="username">
          </div>

          <div class="form__field">
            <label>Email <i>*</i></label>
            <input class="input" name="email" type="email" data-rule="required email" autocomplete="email">
          </div>

          <div class="form__field">
            <label>Password <i>*</i></label>
            <input class="input" name="password" id="pw" type="password" data-rule="required pass" autocomplete="new-password">
            <span class="hint">At least 8 characters.</span>
          </div>

          <div class="form__field">
            <label>Confirm password <i>*</i></label>
            <input class="input" name="password2" type="password" data-rule="required" data-match="#pw" autocomplete="new-password">
          </div>

          <div class="form__field">
            <label>Captcha <i>*</i></label>
            <div class="captcha">
              <span class="captcha__img"></span>
              <button type="button" class="captcha__reload" title="New code">&#8635;</button>
              <input class="input" data-captcha-input placeholder="Enter the code" autocomplete="off">
            </div>
          </div>

          <label class="check">
            <input type="checkbox" data-agree>
            <span>I accept the <a href="agreement.html">User Agreement</a> and the
            <a href="privacy.html">Privacy Policy</a>, and I confirm I am at least 18.</span>
          </label>

          <button class="btn btn--lg btn--block" type="submit">Sign up</button>

          <div class="divider">OR</div>
          <div class="form__foot">
            Already registered? <a href="signin.html">Sign in</a>
          </div>
        </form>
      </div>

      <p class="small muted center" style="margin-top:16px">
        Your password is hashed with scrypt and never stored in readable form.
      </p>
    </div>
  </div>
</main>

<div data-shell-footer></div>

<script src="../assets/js/data.js"></script>
<script src="../assets/js/api.js"></script>
<script src="../assets/js/app.js"></script>
<script src="../assets/js/forms.js"></script>
</body>
</html>
